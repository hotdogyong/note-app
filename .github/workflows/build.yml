name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate

      - name: Build (unsigned)
        id: build
        run: |
          set +e
          xcodebuild -project NoteApp.xcodeproj -scheme NoteApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##g" | awk '!seen[$0]++' > errors.txt
          tail -n 80 build.log > tail.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "xcodebuild exit status: $status"
          head -n 200 errors.txt
          exit 0

      - name: Publish result (branch ci-results)
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp errors.txt tail.txt /tmp/ci/ 2>/dev/null || true
          echo "commit=$GITHUB_SHA status=${{ steps.build.outputs.status }} run=$GITHUB_RUN_ID time=$(date -u +%FT%TZ)" > /tmp/ci/status.txt
          cd /tmp/ci
          git init -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "result for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package ipa
        if: steps.build.outputs.status == '0'
        run: |
          APP=build/Build/Products/Release-iphoneos/NoteApp.app
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry NoteApp.ipa Payload
          ls -la NoteApp.ipa

      - name: Release (latest)
        if: steps.build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NoteApp.ipa --title "latest $(date -u +%F-%H%M)" --notes "commit $GITHUB_SHA" --target "$GITHUB_SHA"

      - name: Fail if build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
